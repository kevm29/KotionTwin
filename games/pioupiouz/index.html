<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pioupiouz</title>
<style>
  :root { --sable: #dec896; --brun: #6b4a1c; --ocre: #a6823a; --creme: #fff6dc; --vert: #5c9a2c; --rouge: #b8442e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2b2113; color: var(--creme); font: 14px/1.4 "Trebuchet MS", Verdana, sans-serif; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: linear-gradient(#7a5422, #5a3c15); border-bottom: 2px solid #3a260b; flex-wrap: wrap; }
  .bar h1 { font-size: 15px; margin: 0; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar h1 small { color: var(--sable); font-weight: normal; margin-left: 6px; }
  button { font: inherit; font-weight: bold; color: var(--brun); background: var(--sable); border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; box-shadow: 0 2px 0 #8b6a2c; }
  button:hover, button:focus-visible { background: #f1dcaa; outline: none; }
  button.go { background: #9bd25c; color: #1f3a0a; box-shadow: 0 2px 0 #4f7d22; }
  .stagewrap { position: relative; flex: 1 1 auto; display: grid; place-items: center; min-height: 0; background: #000; }
  #stage { width: 100%; height: 100%; max-width: calc((100vh - 46px) * 622 / 424); aspect-ratio: 622 / 424; max-height: 100%; }
  .overlay { position: absolute; inset: 0; background: rgba(43, 33, 19, .94); overflow: auto; padding: 14px; display: none; }
  .overlay.on { display: block; }
  .overlay h2 { margin: 0 0 6px; color: var(--sable); font-size: 18px; }
  .overlay p { margin: 4px 0 10px; }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .lv { text-align: left; font-weight: normal; padding: 6px 8px; display: grid; gap: 1px; color: #3a260b; }
  .lv b { font-size: 13px; }
  .lv span { font-size: 11px; color: #6b4a1c; }
  .lv.done { background: #c9e3a1; box-shadow: 0 2px 0 #6f9a3a; }
  .lv.next { outline: 3px solid #ffd34d; }
  .result { max-width: 420px; margin: 8% auto 0; text-align: center; background: #4a3417; border: 2px solid var(--ocre); border-radius: 12px; padding: 18px; }
  .result .big { font-size: 26px; font-weight: bold; color: #ffd34d; }
  .result .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .note { font-size: 12px; color: var(--sable); }
  h3 { margin: 14px 0 6px; font-size: 14px; color: #ffd34d; }
</style>
</head>
<body>
<header class="bar">
  <h1 id="title">Pioupiouz <small id="sub"></small></h1>
  <button id="bList" type="button">Niveaux</button>
  <button id="bRetry" type="button" hidden>Recommencer</button>
</header>
<div class="stagewrap">
  <div id="stage"></div>
  <section id="menu" class="overlay" aria-label="Choix du niveau"></section>
  <section id="end" class="overlay" aria-live="polite"></section>
</div>
<script type="module">
import { mount, store, h } from '../../platforms/flash8/kt-host.js';

const KEY = 'kt.pioupiouz.progress';
const levels = await (await fetch('levels.json')).json();
let progress = store.get(KEY, {});        // id -> { piouz, time }
let current = null;
const $ = id => document.getElementById(id);

const isDone = l => (progress[l.id]?.piouz ?? -1) >= l.piouz;
const nextLevel = () => levels.find(l => !isDone(l)) || levels[0];
const fmt = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function showMenu() {
  const nxt = nextLevel();
  const card = l => h('button', { type: 'button', class: 'lv' + (isDone(l) ? ' done' : '') + (l === nxt ? ' next' : ''), onclick: () => play(l) },
    h('b', {}, l.title), h('span', {}, `${l.piouz} piou${l.piouz > 1 ? 'z' : ''} à sauver` + (progress[l.id] ? ` · record ${progress[l.id].piouz}` : '')));
  const tutos = levels.filter(l => l.tuto), off = levels.filter(l => !l.tuto);
  const done = levels.filter(isDone).length;
  $('menu').replaceChildren(
    h('h2', {}, 'Choisissez un niveau'),
    h('p', {}, `Guidez les piouz jusqu'à la sortie en leur donnant des actions. ${done} / ${levels.length} niveaux réussis.`),
    h('h3', {}, 'Tutoriels'), h('div', { class: 'levels' }, tutos.map(card)),
    h('h3', {}, 'Niveaux officiels'), h('div', { class: 'levels' }, off.map(card)),
    h('p', { class: 'note' }, 'Progression enregistrée dans ce navigateur. Les textes d\'aide des tutoriels ont été réécrits : les originaux ne figurent pas dans l\'archive.'));
  $('menu').classList.add('on');
  $('end').classList.remove('on');
}

async function play(l) {
  current = l;
  $('menu').classList.remove('on');
  $('end').classList.remove('on');
  $('sub').textContent = `· ${l.title} · objectif ${l.piouz} piou${l.piouz > 1 ? 'z' : ''}`;
  $('bRetry').hidden = false;
  await mount($('stage'), {
    swf: 'pioupiouz.swf', base: './', bgcolor: '#dec896',
    flashvars: { lvl: `levels/${l.id}.xml`, $mode: '0', $lang: 'fr', $help: l.tuto ? '1' : '0' },
  });
}

// Appels du jeu (ExternalInterface, voir src/pioupiouz/build.py)
window.ktPiouStart = () => {};
window.ktPiouRetry = () => {};
window.ktPiouExit = (time, piouz, pid) => {
  const l = current; if (!l) return;
  piouz = +piouz || 0; time = +time || 0;
  const ok = piouz >= l.piouz;
  const best = progress[l.id];
  if (!best || piouz > best.piouz || (piouz === best.piouz && time < best.time)) {
    progress[l.id] = { piouz, time }; store.set(KEY, progress);
  }
  const idx = levels.indexOf(l), nxt = levels[idx + 1];
  $('end').replaceChildren(h('div', { class: 'result' },
    h('div', { class: 'big' }, ok ? (piouz > l.piouz ? 'Fantastique !' : 'Victoire !') : (piouz ? 'Encore un effort !' : 'Catastrophe !')),
    h('p', {}, `${piouz} / ${l.piouz} piou${l.piouz > 1 ? 'z' : ''} sauvé${piouz > 1 ? 's' : ''}` + (time ? ` en ${fmt(time)}` : '') + '.'),
    h('div', { class: 'row' },
      ok && nxt ? h('button', { type: 'button', class: 'go', onclick: () => play(nxt) }, 'Niveau suivant') : null,
      h('button', { type: 'button', onclick: () => play(l) }, 'Rejouer'),
      h('button', { type: 'button', onclick: showMenu }, 'Tous les niveaux'))));
  $('end').classList.add('on');
};

$('bList').onclick = showMenu;
$('bRetry').onclick = () => current && play(current);
if (Object.keys(progress).length) showMenu(); else play(nextLevel());
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alphabounce</title>
<style>
  :root { --fond: #05060f; --panneau: #10142b; --ligne: #273063; --texte: #dfe6ff; --doux: #8f9bd0; --jaune: #ffd34d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 13px/1.4 Verdana, "Trebuchet MS", sans-serif; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 6px 10px; background: var(--panneau); border-bottom: 1px solid var(--ligne); }
  .bar b { color: var(--jaune); }
  .bar .sp { flex: 1; }
  button { font: inherit; background: #2a3570; color: var(--texte); border: 1px solid #3c4aa0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover, button:focus-visible { background: #3a4790; outline: none; }
  button[aria-pressed="false"] { opacity: .55; text-decoration: line-through; }
  .stagewrap { flex: 1; display: grid; place-items: center; min-height: 0; overflow: hidden; }
  #box { position: relative; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #1d2650; border: 1px solid var(--jaune); border-radius: 8px; padding: 6px 14px; display: none; }
  .toast.on { display: block; }
</style>
</head>
<body>
<header class="bar" aria-live="polite">
  <span>Position <b id="pos">0 ; 0</b></span>
  <span>Minerai <b id="min">0</b></span>
  <span>Niveaux réussis <b id="lvl">0</b></span>
  <span>Missions <b id="mis">0</b></span>
  <span class="sp"></span>
  <button type="button" id="sfx" aria-pressed="true" title="Bruitages : rebond, brique cassée, bonus">🔊 Sons</button>
  <button type="button" id="music" aria-pressed="true" title="Musique d'ambiance">🎵 Musique</button>
  <button type="button" id="reset">Nouvelle partie</button>
</header>
<div class="stagewrap"><div id="box"><div id="stage"></div></div></div>
<div class="toast" id="toast"></div>
<script>window.KT_DEBUG = /debug/.test(location.search);</script>
<script type="module">
import { mount } from '../../platforms/flash8/kt-host.js';
import { createServer } from './server.js';
import { createAudio } from './audio.js';

const $ = id => document.getElementById(id);
const toast = t => { $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('on'), 3500); };
const server = await createServer((ev, data) => {
  if (ev === 'mission') toast('Mission accomplie !');
});
// Score : on ne meurt jamais vraiment à Alphabounce, le score est le nombre de niveaux réussis
// (cases conquises sur la carte). Le site l'enregistre quand on quitte la page.
const levels = () => Math.max(0, Object.keys(server.player.visited || {}).length - 1);
let startLevels = levels();
const refresh = () => {
  const p = server.player;
  $('pos').textContent = `${p.x} ; ${p.y}`;
  $('min').textContent = p.minerai.toLocaleString('fr');
  $('mis').textContent = server.missionsDone();
  const n = levels();
  $('lvl').textContent = n;
  if (n > startLevels && parent !== window) parent.postMessage({ type: 'kotiontwin:progress', score: n }, '*');
};
setInterval(refresh, 1000); refresh();

// Sons ajoutés par KotionTwin (le jeu d'origine était muet) : le SWF appelle ktSnd(quoi)
const audio = createAudio('sons/');
window.ktSnd = kind => audio.play(kind);
const toggle = (id, key) => {
  const b = $(id), set = on => { b.setAttribute('aria-pressed', String(on)); audio.set(key, on); };
  set(audio.get(key));
  b.onclick = () => set(!audio.get(key));
};
toggle('sfx', 'sfx'); toggle('music', 'music');

// appels ExternalInterface du client d'origine
window.game_playing = () => {};
window.game_update = () => refresh();
window.game_add_mineral = () => refresh();

// Taille de rendu plafonnée : en grand écran, Ruffle calcule les flous et lueurs des effets à la
// résolution de l'écran, ce qui fait ramer. On rend au plus à MAXPX pixels de large puis on agrandit.
const MAXPX = +(new URLSearchParams(location.search).get('maxpx') || 1000);
const fit = () => {
  const r = document.querySelector('.stagewrap').getBoundingClientRect();
  const k = Math.min(r.width / 400, r.height / 360);
  const w = Math.floor(400 * k), h = Math.floor(360 * k);
  const iw = Math.min(w, Math.max(400, MAXPX / (devicePixelRatio || 1)));
  const s = w / iw;
  Object.assign($('box').style, { width: w + 'px', height: h + 'px' });
  Object.assign($('stage').style, { width: iw + 'px', height: Math.round(h / s) + 'px', transform: `scale(${s})` });
};
new ResizeObserver(fit).observe(document.querySelector('.stagewrap'));
fit();

async function start() {
  await mount($('stage'), { swf: 'game.swf', base: './', bgcolor: '#000000', flashvars: { swfUrl: './', lang: 'fr' }, config: { quality: new URLSearchParams(location.search).get('quality') || 'high' } });
}
$('reset').onclick = () => { if (confirm('Effacer la partie et repartir de la Terre… enfin, du point 0 ; 0 ?')) { server.reset(); startLevels = 0; refresh(); start(); } };
start();
</script>
</body>
</html>

name: Déployer sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Valider le catalogue
        run: python3 -c "import json; d=json.load(open('data/games.json')); print(len(d['games']), 'jeux')"
      - name: Numéroter les fichiers du site (évite le mélange d'anciennes et nouvelles versions en cache)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(assets/(js|css)/[A-Za-z0-9_-]+\.(js|css))\"#\1?v=$V\"#g" *.html
          sed -i -E "s#from '\./([A-Za-z0-9_-]+\.js)'#from './\1?v=$V'#g" assets/js/*.js
          grep -h -o 'assets/js/[a-z]*\.js?v=[0-9a-f]*' *.html | sort -u
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
